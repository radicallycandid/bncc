[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bncc-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["anthropic==0.97.0", "networkx>=3.0"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["batch_utils"]
package-dir = {"" = "scripts"}
